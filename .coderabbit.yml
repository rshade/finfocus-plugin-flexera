# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/vendor/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/bin/**"
  path_instructions:
    - path: "**/*.go"
      instructions: |
        Review Go error handling, context cancellation, and gRPC status mapping.
        Do not log refresh tokens, client secrets, bearer tokens, or access tokens.
    - path: "internal/flexeraapi/**"
      instructions: |
        Flexera request and response types come from the generated unified client.
        HTTP 429 and 5xx are retried. Other 4xx responses are not.
  tools:
    golangci-lint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
