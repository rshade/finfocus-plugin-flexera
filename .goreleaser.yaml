version: 2

project_name: finfocus-plugin-flexera

builds:
  - main: ./cmd/finfocus-plugin-flexera
    binary: finfocus-plugin-flexera
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X 'github.com/rshade/finfocus-plugin-flexera/pkg/version.Version={{.Version}}'
      - -X 'github.com/rshade/finfocus-plugin-flexera/pkg/version.GitCommit={{.Commit}}'
      - -X 'github.com/rshade/finfocus-plugin-flexera/pkg/version.BuildDate={{.Date}}'
    env:
      - CGO_ENABLED=0

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch \"amd64\" }}x86_64{{ else }}{{ .Arch }}{{ end }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

source:
  enabled: false
