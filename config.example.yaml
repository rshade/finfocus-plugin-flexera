# Flexera One configuration.
# Environment variables: FLEXERA_REGION, FLEXERA_ORG_ID, FLEXERA_REFRESH_TOKEN,
# FLEXERA_CLIENT_ID, FLEXERA_CLIENT_SECRET, FLEXERA_BILLING_CENTER_IDS.

# Region can be: nam, eu, apac
region: nam

# Numeric Flexera organization ID
orgId: "12345"

# Refresh token, or clientId plus clientSecret. Do not paste an access token.
refreshToken: ""
# clientId: ""
# clientSecret: ""

billingCenterIds:
  - ""

costMetric: cost_amortized_unblended_adj

# Optional: Override auto-configured URL
# baseUrl: https://api.optima.flexeraeng.com/bill-analysis

# Default query window for cost data
defaultWindow: 30d

# HTTP timeout for API calls
timeout: 30s

# Skip TLS verification (for development only)
tlsSkipVerify: false
